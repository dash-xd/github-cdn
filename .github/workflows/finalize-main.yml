name: Finalize github-cdn main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-main.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Make main default and remove old default
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/patch.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            https://api.github.com/repos/dash-xd/github-cdn \
            -d '{"default_branch":"main"}')"
          if [[ "$status" != 200 ]]; then
            cat /tmp/patch.json
            exit 1
          fi

          branch='claude/github-cdn-express-router-l9adw0'
          encoded="$(jq -rn --arg x "$branch" '$x|@uri')"
          status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/dash-xd/github-cdn/git/refs/heads/${encoded}")"
          case "$status" in
            204|404) ;;
            *) cat /tmp/delete.json; exit 1 ;;
          esac
