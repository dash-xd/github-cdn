name: Composition kit smoke

on:
  push:
    branches:
      - candidate/github-cdn-composition
      - main
      - codex/git-composition-role-refs
      - codex/language-implementation-refs
    paths:
      - composition.json
      - default.xml
      - scripts/compose.sh
      - terraform/**
      - .github/workflows/composition-kit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Git composition manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET

          with open('composition.json', encoding='utf-8') as f:
              composition = json.load(f)

          assert composition.get('schema') == 1
          assert composition.get('kind') == 'github-cdn.git-composition'
          assert composition.get('repository') == 'dash-xd/github-cdn'

          components = composition.get('components')
          assert isinstance(components, dict)
          assert set(components) == {'javascript-router', 'go-router'}

          expected = {
              'javascript-router': {
                  'ref': 'js',
                  'capabilities': ['js/router'],
                  'workspace_path': 'javascript',
                  'runtime': 'nodejs24',
                  'entry_point': 'Main',
              },
              'go-router': {
                  'ref': 'go',
                  'capabilities': ['go/router'],
                  'workspace_path': 'golang',
                  'runtime': 'go126',
                  'entry_point': 'Main',
              },
          }

          by_path = {}
          for name, rules in expected.items():
              component = components[name]
              assert component.get('repository') == 'dash-xd/github-cdn'
              for key, value in rules.items():
                  assert component.get(key) == value, (name, key, component.get(key), value)
              commit = component.get('commit', '')
              assert re.fullmatch(r'[0-9a-f]{40}', commit), (name, commit)
              by_path[component['workspace_path']] = commit

          tree = ET.parse('default.xml')
          projects = tree.getroot().findall('project')
          repo_manifest = {
              project.attrib['path']: project.attrib['revision']
              for project in projects
              if project.attrib.get('name') == 'dash-xd/github-cdn.git'
          }
          assert repo_manifest == by_path, (repo_manifest, by_path)
          PY

      - name: Install Android repo launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.local/bin/repo"
          chmod +x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        shell: bash
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform fmt -check -diff -recursive
          terraform init -backend=false
          terraform validate

      - name: Compose JavaScript implementation
        shell: bash
        env:
          GITHUB_CDN_MANIFEST_REVISION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/compose.sh javascript "$RUNNER_TEMP/github-cdn-js"
          jq -e '.implementation == "javascript" and .runtime == "nodejs24" and .implementation_ref == "js" and .capabilities == ["js/router"]' "$RUNNER_TEMP/github-cdn-js/deployment.json"
          test -f "$RUNNER_TEMP/github-cdn-js/javascript/package.json"

      - name: Compose Go implementation
        shell: bash
        env:
          GITHUB_CDN_MANIFEST_REVISION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/compose.sh golang "$RUNNER_TEMP/github-cdn-go"
          jq -e '.implementation == "golang" and .runtime == "go126" and .implementation_ref == "go" and .capabilities == ["go/router"]' "$RUNNER_TEMP/github-cdn-go/deployment.json"
          test -f "$RUNNER_TEMP/github-cdn-go/golang/go.mod"
