name: Repo composition smoke

on:
  push:
    branches:
      - main
    paths:
      - default.xml
      - .github/workflows/repo-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install Android repo launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.local/bin/repo"
          chmod +x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compose default.xml
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/github-cdn-repo"
          cd "$RUNNER_TEMP/github-cdn-repo"
          repo init \
            -u https://github.com/dash-xd/github-cdn.git \
            -b main \
            -m default.xml
          repo sync -c --no-tags

      - name: Test JavaScript implementation
        shell: bash
        working-directory: ${{ runner.temp }}/github-cdn-repo/javascript
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test

      - name: Test Go implementation
        shell: bash
        working-directory: ${{ runner.temp }}/github-cdn-repo/golang
        run: |
          set -euo pipefail
          go mod tidy
          go test ./...
