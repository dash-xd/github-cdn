name: Verify Go implementation

on:
  push:
    branches: [codex/go-gh-token-cdn]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/go-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Normalize module metadata
        shell: bash
        run: go mod tidy

      - name: Test
        shell: bash
        run: go test ./...

      - name: Persist normalized module metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- go.mod go.sum; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          git commit -m 'Normalize Go module metadata'
          git push origin HEAD:codex/go-gh-token-cdn
