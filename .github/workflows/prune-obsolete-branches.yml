name: Prune obsolete github-cdn branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-obsolete-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded non-default branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            claude/express-github-cdn-router-9vlt4g \
            claude/github-app-auth \
            fix/logical-empty-branches
          do
            encoded="$(jq -rn --arg x "$branch" '$x|@uri')"
            status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/dash-xd/github-cdn/git/refs/heads/${encoded}")"
            case "$status" in
              204|404) echo "removed/absent: $branch" ;;
              *) cat /tmp/delete.json; exit 1 ;;
            esac
          done
